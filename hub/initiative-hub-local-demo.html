<title>Initiative Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm single column with a slim top bar; summary before detail, initiative status first, PRD as one tab. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f1f1ee;
  --line: #e6e5e1;
  --fg: #17181a;
  --muted: #6b6d72;
  --faint: #9a9ca1;
  --accent: #2b54e0;
  --accent-soft: #eaf0ff;
  --good: #1f8a4c; --good-soft: #e6f4ec;
  --warn: #b26b00; --warn-soft: #fdf1dc;
  --bad: #c2362b;  --bad-soft: #fbe8e6;
  --new: #0f7a6d;  --new-soft: #e2f4f1;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 4px 16px rgba(20,20,30,.05);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111214; --surface: #18191c; --surface-2: #202125; --line: #2a2b30;
  --fg: #ececee; --muted: #a0a2a8; --faint: #6f7178;
  --accent: #7d9bff; --accent-soft: #1d2440;
  --good: #4cc47f; --good-soft: #15291e; --warn: #f0a83a; --warn-soft: #2d2412;
  --bad: #ff7a6e; --bad-soft: #301a18; --new: #4fd1bf; --new-soft: #12292a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111214; --surface: #18191c; --surface-2: #202125; --line: #2a2b30;
  --fg: #ececee; --muted: #a0a2a8; --faint: #6f7178;
  --accent: #7d9bff; --accent-soft: #1d2440;
  --good: #4cc47f; --good-soft: #15291e; --warn: #f0a83a; --warn-soft: #2d2412;
  --bad: #ff7a6e; --bad-soft: #301a18; --new: #4fd1bf; --new-soft: #12292a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.015em; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 28px; height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: var(--fg); position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: 6px 6px 6px 11px; border-radius: 2px; background: var(--bg); }
.nav { display: flex; gap: 4px; }
.nav button { padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 14px; }
.nav button:hover { color: var(--fg); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.me { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { opacity: .88; }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { height: 30px; padding: 0 12px; font-size: 13px; }

.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }
.stack { display: inline-flex; }
.stack .avatar { box-shadow: 0 0 0 2px var(--surface); }
.stack .avatar + .avatar { margin-left: -3px; }

main { padding-block: 36px 80px; }
.eyebrow { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.h-on { color: var(--good); background: var(--good-soft); }
.h-risk { color: var(--warn); background: var(--warn-soft); }
.h-blocked { color: var(--bad); background: var(--bad-soft); }
.p-neutral { color: var(--muted); background: var(--surface-2); }
.p-new { color: var(--new); background: var(--new-soft); }
.p-accent { color: var(--accent); background: var(--accent-soft); }

/* Home */
.hello h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 600; }
.hello p { margin: 8px 0 0; color: var(--muted); font-size: 17px; max-width: 62ch; }
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }

.attention { margin-top: 36px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.att { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; transition: transform .15s ease; }
.att:hover { transform: translateY(-2px); }
.att .why { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.att .why .dot { width: 8px; height: 8px; border-radius: 50%; }
.att h3 { font-size: 17px; font-weight: 600; }
.att p { margin: 0; color: var(--muted); font-size: 14px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 48px 0 14px; flex-wrap: wrap; }
.section-head h2 { font-size: 20px; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }

.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 2.4fr) 170px 150px minmax(0, 1.3fr) 44px; align-items: center; gap: 20px; padding: 16px 20px; width: 100%; text-align: left; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .title { font-weight: 600; font-size: 15.5px; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .next { font-size: 13.5px; }
.row .next small { display: block; color: var(--muted); font-size: 12.5px; }
.list-head { display: grid; grid-template-columns: minmax(0, 2.4fr) 170px 150px minmax(0, 1.3fr) 44px; gap: 20px; padding: 10px 20px; font-size: 12px; color: var(--faint); font-weight: 500; }

/* Phase track */
.phase-mini { display: flex; gap: 3px; align-items: center; }
.phase-mini i { width: 18px; height: 5px; border-radius: 3px; background: var(--line); }
.phase-mini i.on { background: var(--fg); }
.phase-mini i.now { background: var(--accent); }
.phase-label { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* Ring */
.ring { --p: 0; width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(var(--fg) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.ring::after { content: attr(data-v); width: 28px; height: 28px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row:hover .ring::after { background: var(--surface-2); }

/* Initiative page */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; }
.back:hover { color: var(--fg); }
.hero { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
.hero h1 { font-size: clamp(30px, 4.5vw, 44px); font-weight: 600; line-height: 1.08; }
.hero .goal { margin: 12px 0 0; font-size: 18px; color: var(--muted); max-width: 56ch; }
.meta { display: flex; gap: 16px; align-items: center; margin-top: 20px; flex-wrap: wrap; font-size: 14px; }
.meta .who { display: flex; align-items: center; gap: 8px; }

.decision { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.decision .big { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.decision .when { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--fg); border-radius: 999px; }

.track { margin-top: 36px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.track .step { padding-top: 12px; border-top: 3px solid var(--line); font-size: 13px; color: var(--faint); font-weight: 500; }
.track .step.done { border-color: var(--fg); color: var(--muted); }
.track .step.now { border-color: var(--accent); color: var(--fg); }
.track .step small { display: block; font-weight: 400; color: var(--faint); font-size: 12px; }

.tabs { margin-top: 36px; display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 12px 14px; font-size: 14.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--fg); }
.tabs .count { font-size: 12px; color: var(--faint); margin-left: 4px; }

.pane { padding-top: 28px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; }
.card + .card { margin-top: 24px; }
.card h3 { font-size: 15px; font-weight: 600; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }

.update { display: flex; gap: 14px; }
.update p { margin: 6px 0 0; font-size: 15.5px; line-height: 1.6; }
.update .when { font-size: 13px; color: var(--muted); }

.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.todo li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; padding-top: 0; }
.todo .box { width: 18px; height: 18px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--faint); margin-top: 2px; }
.todo .t { font-weight: 500; font-size: 14.5px; }
.todo .d { font-size: 13px; color: var(--muted); }

.metric { display: flex; flex-direction: column; gap: 4px; }
.metric .v { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.metric .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px; margin-top: 12px; }
.bars .b { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.bars .b i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }

.risks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.risk { border-radius: 12px; padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.risk b { font-size: 13.5px; font-weight: 600; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline li { display: grid; grid-template-columns: 88px 14px minmax(0, 1fr); gap: 10px; padding: 6px 0; font-size: 14px; align-items: start; }
.timeline .date { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding-top: 1px; }
.timeline .pt { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; box-shadow: inset 0 0 0 2px var(--faint); }
.timeline .pt.done { background: var(--fg); box-shadow: none; }
.timeline .pt.next { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

/* Compare */
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); gap: 2px; }
.seg button { height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.compare-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.compare.single { grid-template-columns: minmax(0, 1fr); max-width: 640px; margin: 0 auto; }
.side-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.side-label h3 { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.newonly { display: flex; gap: 10px; align-items: center; justify-content: center; font-size: 14px; color: var(--new); background: var(--new-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px; }

/* Device frame for screens */
.device { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 14px; }
.screen { border-radius: 12px; background: var(--bg); min-height: 420px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.screen .bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.screen h4 { margin: 4px 0 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.sk { background: var(--surface); border-radius: 10px; padding: 12px; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line); }
.sk .l { height: 8px; border-radius: 4px; background: var(--line); margin-top: 6px; }
.stepper { display: flex; gap: 4px; }
.stepper i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.stepper i.on { background: var(--fg); }
.cta { margin-top: auto; height: 42px; border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; width: 100%; }
.cta.proto { background: var(--accent); color: #fff; }
.pain { font-size: 12px; color: var(--bad); display: flex; gap: 6px; align-items: center; }
.hotspot { position: relative; }
.hotspot::after { content: ""; position: absolute; inset: -4px; border-radius: 13px; box-shadow: 0 0 0 2px var(--accent); opacity: 0; animation: pulse 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .hotspot::after { animation: none; opacity: .35; } .att { transition: none; } }
.proto-note { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 10px; }

/* Site map tree */
.tree { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px solid var(--line); margin-left: 10px; }
.node { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; }
.node .path { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.node .name { font-weight: 500; }
.node .pill { margin-left: auto; height: 22px; font-size: 12px; }
.node.removed .name { text-decoration: line-through; color: var(--faint); }
.node.c-new { background: var(--new-soft); }
.node.c-improved { background: var(--accent-soft); }
.node.c-removed { background: var(--bad-soft); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }

/* Journey */
.journey { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.journey li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; background: var(--surface); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.journey .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.journey .t { font-weight: 500; }
.journey .s { font-size: 13px; color: var(--muted); }
.journey .gone { opacity: .5; }

/* PRD */
.prd-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); display: flex; flex-direction: column; gap: 2px; }
.toc .grp { font-size: 12px; color: var(--faint); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
.toc .grp:first-child { margin-top: 0; }
.toc button { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; font-size: 13.5px; text-align: left; color: var(--muted); }

function importOutline() {
  modal({
    title: "Import a site map outline", sub: "Paste an indented outline: each indent is one level deeper. Add the path and type after a |. Pages that already exist with the same name and parent are kept.", submit: "Import",
    fields: [
      [{ name: "side", label: "Site map", type: "select", value: ui.smSide || "vision", options: [["vision", "2028 vision"], ["today", "Today"]] }, { name: "init", label: "Initiative", type: "select", value: "", options: [["", "None"], ...inits().map((x) => [x.id, x.name])] }],
      { name: "text", label: "Outline", type: "textarea", rows: 12, placeholder: "Home | /\n  Ride | /ride\n    Where to? | /ride/destination\n    Choose ride | /ride/options\n    Payment sheet | /ride/pay | modal\n  Account | /account\n    Trips | /account/trips" },
    ],
    async onSubmit(v, progress) {
      const lines = v.text.split("\n").filter((l) => l.trim());
      if (!lines.length) return "Paste an outline.";
      const stack = []; let made = 0, o = Date.now();
      for (const raw of lines) {
        const ws = raw.match(/^[\s\-*•]*/)[0].replace(/\t/g, "    ").replace(/[-*•]/g, " ").length;
        const [name, path = "", type = ""] = raw.trim().replace(/^[-*•]\s*/, "").split("|").map((c) => c.trim());
        if (!name) continue;
        while (stack.length && stack.at(-1).ws >= ws) stack.pop();
        const parent = stack.length ? stack.at(-1).id : "";
        let n = pages().find((p) => p.side === v.side && (p.parent || "") === parent && p.name.toLowerCase() === name.toLowerCase());
        if (!n) {
          const id = "p-" + slug(name) + "-" + uid(), tp = Object.keys(PTYPE).find((k) => k === type.toLowerCase() || PTYPE[k].toLowerCase().startsWith(type.toLowerCase() || "~")) || "page";
          n = { id, name, path, side: v.side, change: v.side === "today" ? "keep" : "new", parent, type: tp, platform: "both", notes: "", initiatives: v.init ? [v.init] : [], order: o++ };
          progress(`Adding ${++made}…`); await write("nodes/" + id, n); store.nodes[id] = n;
        }
        stack.push({ ws, id: n.id });
      }
      toast(`Imported ${made} page${made === 1 ? "" : "s"}`);
    },
  });
}

// ---------- writes ----------
async function write(path, data, merge) {
  if (mode !== "live") { toast("Open this page in Claude to save changes"); throw new Error("offline"); }
  try {
    const ref = db.doc(path);
    if (merge) await ref.update(data); else await ref.set(data);
  } catch (e) {
    if (e && e.code === "invalid_argument") { canEdit = false; canWrite = false; render(); toast("You can view this page but not change it"); }
    else if (e && e.code === "quota_exceeded") toast("Storage is full. Remove old examples or files.");
    else toast("Couldn't save. Try again.");
    throw e;
  }
}
async function remove(path) { if (mode !== "live") return; try { await db.doc(path).delete(); } catch { toast("Couldn't delete. Try again."); } }

// ---------- modal ----------
function modal({ title, sub, fields, submit = "Save", onSubmit, onDelete, deleteLabel = "Delete" }) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const f = (fl) => {
    const id = "m-" + fl.name;
    const val = fl.value ?? "";
    let ctl;
    if (fl.type === "textarea") ctl = `<textarea id="${id}" name="${fl.name}" rows="${fl.rows || 4}" placeholder="${esc(fl.placeholder || "")}">${esc(val)}</textarea>`;
    else if (fl.type === "select") ctl = `<select id="${id}" name="${fl.name}">${fl.options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    else if (fl.type === "file") ctl = `<input id="${id}" name="${fl.name}" type="file" ${fl.accept ? `accept="${fl.accept}"` : ""} ${fl.multiple ? "multiple" : ""}>`;
    else ctl = `<input id="${id}" name="${fl.name}" type="${fl.type || "text"}" value="${esc(val)}" placeholder="${esc(fl.placeholder || "")}" ${fl.required ? "required" : ""} ${fl.step ? `step="${fl.step}"` : ""}>`;
    return `<div class="field"><label for="${id}">${esc(fl.label)}</label>${ctl}${fl.hint ? `<span class="hint">${esc(fl.hint)}</span>` : ""}</div>`;
  };
  const rows = fields.map((fl) => Array.isArray(fl) ? `<div class="fields-${fl.length}">${fl.map(f).join("")}</div>` : f(fl)).join("");
  scrim.innerHTML = `<form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}
    ${rows}
    <div class="err" hidden></div>
    <div class="modal-actions">
      ${onDelete ? `<button type="button" class="danger" data-m="delete">${esc(deleteLabel)}</button>` : ""}
      <button type="button" class="btn ghost" data-m="cancel">Cancel</button>
      <button type="submit" class="btn">${esc(submit)}</button>
    </div></form>`;
  document.body.appendChild(scrim);
  const form = scrim.querySelector("form");
  let confirmDel = false;
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("mousedown", (e) => { if (e.target === scrim) close(); });
  scrim.querySelector('[data-m="cancel"]').onclick = close;
  const del = scrim.querySelector('[data-m="delete"]');
  if (del) del.onclick = async () => {
    if (!confirmDel) { confirmDel = true; del.textContent = "Click again to confirm"; return; }
    try { await onDelete(); close(); } catch { /* toast shown */ }
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form); const v = {};
    for (const fl of fields.flat()) v[fl.name] = fl.type === "file" ? fd.getAll(fl.name).filter((x) => x && x.size) : String(fd.get(fl.name) ?? "").trim();
    const err = scrim.querySelector(".err");
    const sb = form.querySelector('[type="submit"]'); sb.disabled = true; sb.textContent = "Saving…";
    const progress = (m) => { sb.textContent = m; };
    try { const msg = await onSubmit(v, progress); if (typeof msg === "string") { err.textContent = msg; err.hidden = false; sb.disabled = false; sb.textContent = submit; return; } close(); }
    catch { sb.disabled = false; sb.textContent = submit; }
  };
  setTimeout(() => form.querySelector("input:not([type=hidden]),textarea,select")?.focus(), 30);
}

    <div class="chips" role="group" aria-label="Filter by phase">
      <button class="chip" data-phase="-1" aria-pressed="${ui.phaseFilter < 0}">All</button>
      ${PHASES.map((p, i) => `<button class="chip" data-phase="${i}" aria-pressed="${ui.phaseFilter === i}">${p}</button>`).join("")}
    </div>
  </div>
  <div class="list-head"><span>Initiative</span><span>Phase</span><span>Health</span><span>Next milestone</span><span>PRD</span></div>
  <div class="list">
    ${shown.map((x) => `
      <button class="row" data-open="${esc(x.id)}">
        <div style="min-width:0;display:flex;gap:12px;align-items:center">${av(note(x.owner))}
          <div style="min-width:0"><div class="title">${esc(x.name)}${exTag(x)}</div><div class="sub">${esc(x.team)}${objTitle(x) ? " · " + esc(objTitle(x)) : ""}</div></div></div>
        <div>${phaseMini(x.phase || 0)}</div>
        <div>${healthPill(x.health)}</div>
        <div class="next">${esc(x.next?.label || "—")}<small>${esc(showDate(x.next?.date || ""))}</small></div>
        <div class="ring" style="--p:${readiness(x)}" data-v="${readiness(x)}" title="PRD ${readiness(x)}% ready"></div>
      </button>`).join("") || `<div style="padding:28px;text-align:center" class="muted">No initiatives in ${PHASES[ui.phaseFilter]} right now.</div>`}
  </div>`;
}

function initiative(x) {
  const r = readiness(x);
  const crew = x.crew && x.crew.length ? x.crew : [x.owner];
  crew.forEach(note);
  const tabs = [["overview", "Overview"], ["roadmap", "Roadmap", (x.releases || []).length], ["learning", "Learning plan", (x.learning || []).length], ["readiness", "Readiness", (x.biz || []).length ? `${bizPct(x)}%` : 0], ["compare", "Today vs 2028"], ["prd", "PRD", `${r}%`], ["evidence", "Evidence", (x.files || []).length], ["discussion", "Discussion", commentsFor(x.id).length]];
  const nr = nextRelease(x);
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <button class="back" data-go="home">← All initiatives</button>
    ${canEdit ? `<button class="btn ghost small" data-action="edit-initiative">Edit status & details</button>` : ""}
  </div>
  <section class="hero">
    <div>
      <div class="eyebrow">${esc(x.team)}${x.example ? " · Example" : ""}</div>
      <h1 style="margin-top:6px">${esc(x.name)}</h1>
      <p class="goal">${esc(x.goal)}</p>
      <div class="obj-link" style="margin-top:10px">${objTitle(x) ? `Objective: <b>${esc(objTitle(x))}</b>` : `<span class="pill h-risk">No objective yet</span>`}</div>
      <div class="meta">
        ${healthPill(x.health)}
        <span class="pill p-neutral">${PHASES[x.phase || 0]}</span>
        ${x.exists ? `<span class="pill p-accent">Improves what exists</span>` : `<span class="pill p-new">New for customers</span>`}
        <span class="who"><span class="stack">${crew.map((c) => av(c, 1)).join("")}</span><span class="muted">Led by ${esc(person(x.owner).name)}</span></span>
      </div>
    </div>
    <aside class="decision">
      <div class="eyebrow">Next milestone</div>
      <div><div class="big">${esc(x.next?.label || "Not set")}</div><div class="when">${esc(showDate(x.next?.date || ""))}</div></div>
      ${nr ? `<button class="next-rel" data-tab="roadmap"><span class="eyebrow">Next release</span><b>${esc(nr.name)}</b><span class="when">${esc(showDate(nr.date))}</span></button>` : ""}
      ${x.decisionNote ? `<p style="margin:0;font-size:14px" class="muted">${esc(x.decisionNote)}</p>` : ""}
      <div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>PRD readiness</span><span class="num">${r}%</span></div>
        <div class="meter"><i style="width:${r}%"></i></div>
      </div>
    </aside>
  </section>
  <div class="track" aria-label="Phase">
    ${PHASES.map((p, i) => `<div class="step ${i < x.phase ? "done" : i === x.phase ? "now" : ""}">${p}<small>${PHASE_HINT[i]}</small></div>`).join("")}
  </div>
  <div class="tabs" role="tablist">
    ${tabs.map(([k, l, c]) => `<button role="tab" data-tab="${k}" aria-selected="${ui.tab === k}">${l}${c !== undefined && c !== 0 ? `<span class="count">${c}</span>` : ""}</button>`).join("")}
  </div>
  <div class="pane">${({ overview, roadmap: roadmapTab, learning: learningTab, readiness: readinessTab, compare, prd, evidence, discussion }[ui.tab] || overview)(x)}</div>`;
}

function overview(x) {
  const ups = updatesFor(x.id), u = ups[0];
  if (u) note(u.who);
  const g = gaps(x);
  const krGaps = krsOf(x).filter(krNeeds).map((k) => ({ need: `${krNeeds(k)}: ${k.n}`, t: "OKRs", s: "data" }));
  if (!objTitle(x)) krGaps.push({ need: "Write the objective for this initiative", t: "OKRs", s: "missing" });
  if (!krsOf(x).length) krGaps.push({ need: "Add key results for this initiative", t: "OKRs", s: "missing" });
  const dk = dueKrs(x).length;
  if (dk) krGaps.unshift({ need: `This week's check-in for ${dk} key result${dk === 1 ? "" : "s"}`, t: "OKRs", s: "info" });
  if (!(x.releases || []).length) krGaps.push({ need: "Add the releases planned this year", t: "Roadmap", s: "missing" });
  if (!(x.learning || []).length) krGaps.push({ need: "Write a learning plan: what you need to learn and how", t: "Learning plan", s: "missing" });
  if ((x.phase || 0) >= 2 && !(x.biz || []).length) krGaps.push({ need: "Plan business readiness for teams and customers", t: "Readiness", s: "missing" });
  const blockers = krGaps.concat(g.filter((y) => y.need && y.k !== "metrics")).concat(g.filter((y) => !y.need && y.s === "missing")).slice(0, 6);
  const riskKeys = [["value", "Value"], ["usability", "Usability"], ["feasibility", "Feasibility"], ["viability", "Viability"]];
  const tl = x.timeline || [];
  return `
  <div class="grid-2">
    <div>
      <div class="card">
        <div class="card-head"><h3>Latest update</h3>${canEdit ? `<button class="btn ghost small" data-action="post-update">Post update</button>` : ""}</div>
        ${u ? `<div class="update">${av(u.who)}<div><div class="when"><b style="color:var(--fg);font-weight:600">${esc(person(u.who).name)}</b> · ${ago(u.at)}${u.health ? ` · ${healthPill(u.health)}` : ""}</div><p>${esc(u.text)}</p></div></div>
          ${ups.length > 1 ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:13.5px">${ups.length - 1} earlier update${ups.length > 2 ? "s" : ""}</summary><div class="updates-list">${ups.slice(1).map((v) => `<div class="update">${av(note(v.who), 1)}<div><div class="when"><b style="color:var(--fg);font-weight:600">${esc(person(v.who).name)}</b> · ${ago(v.at)}</div><p>${esc(v.text)}</p></div></div>`).join("")}</div></details>` : ""}`
          : `<p class="muted" style="margin:0">No updates yet. ${canEdit ? "Post one so everyone knows where this stands." : ""}</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h3>To move forward</h3>${canEdit ? `<button class="edit-btn" data-action="add-documents">Fill from documents</button>` : ""}<span class="muted" style="font-size:13px">${g.length ? `${g.length} PRD items open` : "PRD complete"}</span></div>
        ${blockers.length ? `<ul class="todo">${blockers.map((b) => `
          <li><span class="box"></span><div><div class="t">${esc(b.need || `Write "${b.t}"`)}</div><div class="d">${esc(b.t)}</div></div><span class="pill s-pill-${b.s}">${S[b.s]}</span></li>`).join("")}</ul>
          <button class="btn ghost small" style="margin-top:14px" data-tab="prd">Open the PRD checklist</button>`
        : `<p class="muted" style="margin:0">Nothing open. Every PRD item is ready.</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h3>Milestones</h3><span>${editBtn("import-milestones", "Import")}${editBtn("add-milestone", "Add")}</span></div>
        ${tl.length ? milestoneList(x) : `<p class="muted" style="margin:0">No milestones yet.</p>`}
        <button class="btn ghost small" style="margin-top:14px" data-tab="roadmap">Roadmap and releases</button>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-head"><h3>OKRs</h3>${editBtn("add-kr", "Add key result")}</div>
        <div class="obj-link ${canEdit ? "clickable" : ""}" style="margin-bottom:14px;padding:6px 8px;margin-left:-8px" ${canEdit ? `data-action="edit-objective" role="button" tabindex="0"` : ""}>Objective: ${objTitle(x) ? `<b>${esc(objTitle(x))}</b>` : `<span style="color:var(--warn)">Not set yet${canEdit ? ", click to add" : ""}</span>`}</div>
        <div style="display:flex;flex-direction:column;gap:12px">${krsOf(x).map((k, i) => krRow(k, i, x)).join("") || `<p class="muted" style="margin:0;font-size:14px">No key results yet. Every initiative needs at least one, with a baseline and a target.</p>`}</div>
        <button class="btn ghost small" style="margin-top:16px" data-go="okrs">See all OKRs</button>
      </div>
      <div class="card">
        <div class="card-head"><h3>The four risks</h3></div>
        <div class="risks">${riskKeys.map(([k, l]) => `<button class="risk" style="text-align:left" data-tab="prd" data-jumpto="${k}"><b>${l}</b><span class="pill s-pill-${statusOf(x, k)}" style="align-self:flex-start">${S[statusOf(x, k)]}</span></button>`).join("")}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Team</h3>${editBtn("edit-team", "Edit")}</div>
        <div style="display:flex;flex-direction:column;gap:10px">${(x.crew && x.crew.length ? x.crew : [x.owner]).map((c, i) => `<div style="display:flex;gap:10px;align-items:center;font-size:14px">${av(c)}<span>${esc(person(c).name)}</span><span class="muted" style="margin-left:auto;font-size:13px">${esc((x.roles || [])[i] || (i === 0 ? "Lead" : "Member"))}</span></div>`).join("")}</div>
      </div>
    </div>
  </div>`;
}

// Example-only mock screens (the two example initiatives); real initiatives use uploaded screens.
function demoScreens(x) {
  if (x.demo === "checkout") {
    const today = `<div class="device"><div class="screen"><div class="bar"><span>Step 2 of 6</span><span>shop.example</span></div>
      <div class="stepper">${[1, 1, 0, 0, 0, 0].map((o) => `<i class="${o ? "on" : ""}"></i>`).join("")}</div><h4>Delivery options</h4>
      <div class="sk">Standard delivery<div class="l" style="width:60%"></div></div><div class="sk">Express delivery<div class="l" style="width:45%"></div></div>
      <div class="pain">● Delivery dates aren't shown until step 4</div><div class="sk" style="opacity:.6">Next: Payment → Review order</div>
      <button class="cta" tabindex="-1">Continue</button></div></div>`;
    const P = [
      `<div class="bar"><span>Checkout</span><span>shop.example</span></div><h4>Check and pay</h4>
       <div class="sk"><b style="font-weight:600">Deliver to</b><div class="muted">Café Lumen, 22 Harbor St</div></div>
       <div class="sk"><b style="font-weight:600">Arrives Thu, Nov 26</b><div class="muted">Standard · free</div></div>
       <div class="sk"><b style="font-weight:600">Pay with</b><div class="muted">Visa ending 4242</div></div>
       <button class="cta proto hotspot" data-proto="1">Pay $184.20</button>`,
      `<div class="bar"><span>Checkout</span><span>shop.example</span></div>
       <div style="margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:52px;height:52px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-size:24px">✓</div><h4>Order placed</h4><p class="muted" style="margin:0;font-size:14px">Arrives Thursday, November 26</p></div>
       <button class="cta hotspot" data-proto="0" style="background:var(--surface-2);color:var(--fg)">Start over</button>`,
    ];
    return [today, `<div class="device"><div class="screen">${P[ui.proto % 2]}</div></div><p class="proto-note">Clickable: tap the highlighted button.</p>`];
  }
  if (x.demo === "onboarding") {
    const P = [
      `<div class="bar"><span>Setup · 1 of 3</span><span>app.example</span></div><div class="stepper"><i class="on"></i><i></i><i></i></div><h4>Tell us about your business</h4><div class="sk">Business type<div class="l" style="width:40%"></div></div><div class="sk">How many people order?<div class="l" style="width:30%"></div></div><button class="cta proto hotspot" data-proto="1">Continue</button>`,
      `<div class="bar"><span>Setup · 2 of 3</span><span>app.example</span></div><div class="stepper"><i class="on"></i><i class="on"></i><i></i></div><h4>Add your products</h4><div class="sk" style="text-align:center;padding:26px 12px">Drop a spreadsheet<div class="muted" style="font-size:12px">or import from a catalog</div></div><button class="cta proto hotspot" data-proto="2">Import 48 products</button>`,
      `<div class="bar"><span>Setup · 3 of 3</span><span>app.example</span></div><div class="stepper"><i class="on"></i><i class="on"></i><i class="on"></i></div><h4>Place your first order</h4><div class="sk">Oat milk 1L × 12<div class="muted" style="font-size:12px">Suggested from your products</div></div><button class="cta proto hotspot" data-proto="0">Place order</button>`,
    ];
    return ["", `<div class="device"><div class="screen">${P[ui.proto % 3]}</div></div><p class="proto-note">Clickable: tap the highlighted button.</p>`];
  }
  return null;
}

function sides(single, left, right, leftAction, rightAction) {
  const L = `<div><div class="side-label"><h3><span class="sdot" style="background:var(--faint)"></span>Today</h3>${leftAction || ""}</div>${left}</div>`;
  const R = `<div><div class="side-label"><h3><span class="sdot" style="background:var(--accent)"></span>2028 vision</h3>${rightAction || ""}</div>${right}</div>`;
  return `<div class="compare ${single ? "single" : ""}">${single ? R : L + R}</div>`;
}

function compare(x) {
  const single = !x.exists;
  const j = x.journey || { today: [], vision: [] };
  let body = "";
  if (ui.view === "screens") {
    const demo = demoScreens(x);
    const shot = (ids) => ids && ids.length ? `<div class="shots">${ids.map((id) => `<img src="/_blob/${esc(id)}" alt="Screen" loading="lazy">`).join("")}</div>` : `<div class="card muted" style="text-align:center;font-size:14px">No screens yet.</div>`;
    const proto = safeUrl(x.prototypeUrl) ? `<a class="btn small" href="${esc(x.prototypeUrl)}" target="_blank" rel="noopener noreferrer">Open prototype ↗</a>` : "";
    if (demo) body = sides(single, demo[0], demo[1]);
    else body = sides(single, shot((x.screens || {}).today),
      `${shot((x.screens || {}).vision)}${!safeUrl(x.prototypeUrl) ? `<p class="proto-note">${canEdit ? "Add the prototype link in Edit status & details." : "No prototype linked yet."}</p>` : ""}`,
      canEdit ? `<button class="edit-btn" data-action="upload-screen" data-side="today">Add screen</button>` : "",
      `<span style="display:flex;gap:6px;align-items:center">${proto}${canEdit ? `<button class="edit-btn" data-action="upload-screen" data-side="vision">Add screen</button>` : ""}</span>`);
  } else if (ui.view === "sitemap") {
    const ns = pages().filter((n) => (n.initiatives || []).includes(x.id));
    const t = ns.filter((n) => n.side === "today"), v = ns.filter((n) => n.side === "vision");
    const fl = (arr) => arr.length ? `<ul class="tree">${arr.map((n) => nodeRow(n)).join("")}</ul>` : `<p class="muted" style="font-size:14px">No pages tagged yet.</p>`;
    body = sides(single, fl(t), fl(v)) + `<p class="proto-note" style="text-align:left">Pages come from the <button data-go="sitemap" style="text-decoration:underline">shared site map</button>. Tag a page with this initiative to show it here.</p>`;
  } else {
    const jl = (arr, pains) => arr.length ? `<ol class="journey">${arr.map((s, i) => `<li><span class="n">${i + 1}</span><div><div class="t">${esc(s.t)}</div>${s.s ? `<div class="${pains ? "pain" : "s"}">${pains ? "● " : ""}${esc(s.s)}</div>` : ""}</div></li>`).join("")}</ol>` : `<p class="muted" style="font-size:14px">No steps yet.</p>`;
    body = sides(single, jl(j.today || [], true), jl(j.vision || [], false), "", editBtn("edit-journey", "Edit journey"));
  }
  const jt = (j.today || []).length, jv = (j.vision || []).length;
  return `
  <div class="compare-bar">
    <div class="seg" role="group" aria-label="Compare view">${[["screens", "Screens"], ["sitemap", "Site map"], ["journey", "Journey"]].map(([k, l]) => `<button data-view="${k}" aria-pressed="${ui.view === k}">${l}</button>`).join("")}</div>
    <span class="muted" style="font-size:14px">${x.exists ? (jt || jv ? `${jt} steps today → ${jv} in 2028` : "") : jv ? `${jv} steps, all new` : ""}</span>
  </div>
  ${single ? `<div class="newonly">Nothing like this exists today, so you're seeing the 2028 version only.</div>` : ""}
  ${body}`;
}

function prd(x) {
  const df = x.draftedFrom || [];
  return `${df.length ? `<div class="banner"><span>Drafted with Claude from ${df.length} document${df.length > 1 ? "s" : ""} (${esc(df.slice(0, 3).join(", "))}${df.length > 3 ? "…" : ""}). Check each section and set its status.</span>${canEdit ? `<button class="btn ghost small" data-action="add-documents">Add more documents</button>` : ""}</div>` : ""}<div class="prd-layout">
    <nav class="toc" aria-label="PRD sections">${SECTIONS.map(([gname, secs]) => `<div class="grp">${gname}</div>${secs.map(([k, t]) => `<button data-jump="${k}"><span class="sdot s-${statusOf(x, k)}"></span>${esc(t)}</button>`).join("")}`).join("")}</nav>
    <article class="doc">
      <div class="prd-head">
        <div><div class="eyebrow">Product requirements</div><div class="big">${readiness(x)}% ready</div>
          <div class="muted" style="font-size:13.5px">${["ready", "draft", "data", "validation", "info", "missing"].map((st) => [st, ALL_KEYS.filter((k) => statusOf(x, k) === st).length]).filter(([, n]) => n).map(([st, n]) => `${n} ${S[st].toLowerCase()}`).join(" · ")}${x.updatedAt ? ` · updated ${ago(x.updatedAt)}` : ""}</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${linkChip(x.confluence, "Confluence")}${linkChip(x.jira, "Jira")}<button class="btn ghost small" data-action="copy-prd">Copy as Markdown</button></div>
        <div class="meter" style="grid-column:1/-1"><i style="width:${Math.max(readiness(x), 2)}%"></i></div>
      </div>
      ${SECTIONS.map(([gname, secs]) => `<div class="group-title">${gname}</div>${secs.map(([k, t, q, ev]) => {
        const s = statusOf(x, k), body = (x.text || {})[k], need = (x.need || {})[k];
        return `<section class="sec" id="sec-${k}">
          <div class="sec-head"><div><h3>${esc(t)}</h3><div class="q">${esc(q)}</div></div><div style="display:flex;gap:6px;align-items:center">${editBtn("edit-section", "Edit", `data-k="${k}"`)}<span class="pill s-pill-${s}">${S[s]}</span></div></div>
          ${body ? `<div class="body" style="white-space:pre-wrap">${esc(body)}</div>` : LIST[k] && (x[k] || []).length ? "" : `<div class="empty"><b>Not written yet</b>Usually backed by: ${esc(ev)}.${canEdit && !LIST[k] ? ` <button data-action="edit-section" data-k="${k}" style="color:var(--accent);font-weight:500">Start writing</button>` : ""}</div>`}
          ${LIST[k] ? prdList(x, k) : ""}${k === "ux" ? uxLinked(x) : ""}${k === "scope" && (x.releases || []).length ? `<div class="linked"><div class="eyebrow">Releases</div>${relsOf(x).map((r) => `<div class="d" style="margin-top:6px"><b>${esc(r.name)}</b> · ${esc(showDate(r.date))}${r.scope ? ": " + esc(r.scope) : ""}</div>`).join("")}</div>` : ""}
          ${need && s !== "ready" ? `<div class="need"><b style="font-weight:600">Still needed</b>${esc(need)}</div>` : ""}
        </section>`;
      }).join("")}`).join("")}
    </article></div>`;
}

const THUMB = { doc: ["DOC", "var(--accent-soft)", "var(--accent)"], sheet: ["SHEET", "var(--good-soft)", "var(--good)"], link: ["LINK", "var(--warn-soft)", "var(--warn)"], img: ["IMAGE", "var(--surface-2)", "var(--muted)"], pdf: ["PDF", "var(--bad-soft)", "var(--bad)"], proto: ["PROTOTYPE", "var(--new-soft)", "var(--new)"], board: ["FIGJAM", "color-mix(in srgb, #8a5cf6 14%, transparent)", "#7c4ee4"], file: ["FILE", "var(--surface-2)", "var(--muted)"] };
function evidence(x) {
  const files = x.files || [];
  return `<div class="files">
    ${files.map((f, i) => { const th = THUMB[f.kind] || THUMB.file; const href = f.assetId ? "/_blob/" + f.assetId : safeUrl(f.url); return `<div class="file">
      ${href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">` : "<div>"}
      <div class="thumb" style="background:${th[1]};color:${th[2]}">${f.kind === "img" && f.assetId ? `<img src="/_blob/${esc(f.assetId)}" alt="" loading="lazy">` : th[0]}</div>
      <div class="info"><b>${esc(f.name)}</b><span>${esc(f.label || th[0].toLowerCase())} · ${esc(f.ctx || "Evidence")}</span></div>
      ${href ? "</a>" : "</div>"}
      ${canEdit ? `<div class="info" style="padding-top:0"><button class="edit-btn" style="align-self:flex-start;padding-left:0" data-action="remove-file" data-i="${i}">Remove</button></div>` : ""}
    </div>`; }).join("")}
    ${canEdit ? `<button class="drop" data-action="add-documents"><div><div style="font-weight:600;color:var(--fg)">Add documents to the PRD</div>Claude reads them and updates<br>the sections they cover</div></button>` : ""}
    ${canEdit ? `<button class="drop" data-action="add-evidence"><div><div style="font-weight:600;color:var(--fg)">Add evidence</div>Upload a file or paste a link<br>PDF, images, Google Docs, FigJam</div></button>` : files.length ? "" : `<p class="muted">No evidence yet.</p>`}
  </div>`;
}

function discussion(x) {

  else if (a === "add-evidence") addEvidence(x);
  else if (a === "remove-file") { const f = (x.files || []).slice(); f.splice(+t.dataset.i, 1); saveInit(x, { files: f }).then(() => toast("Removed")).catch(() => {}); }
  else if (a === "upload-screen") uploadScreen(x, t.dataset.side);
  else if (a === "edit-journey") editJourney(x);
  else if (a === "edit-links") editLinks(x);
  else if (a === "add-item") editItem(x, t.dataset.k, null);
  else if (a === "edit-item") editItem(x, t.dataset.k, t.dataset.id);
  else if (a === "import-milestones") importMilestones(x);
  else if (a === "add-release") editRelease(x, null);
  else if (a === "edit-release") editRelease(x, t.dataset.id);
  else if (a === "add-learning") editLearning(x, null);
  else if (a === "edit-learning") editLearning(x, t.dataset.id);
  else if (a === "add-biz") editBiz(x, null, t.dataset.aud);
  else if (a === "edit-biz") editBiz(x, t.dataset.id);
  else if (a === "edit-expect") editExpect(x, t.dataset.aud);
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", (e) => { if (e.target.id === "sm-q") { ui.smQ = e.target.value; render(); } });
document.addEventListener("toggle", (e) => { const h = e.target.dataset && e.target.dataset.hid; if (h) { if (e.target.open) ui.openHist.add(h); else ui.openHist.delete(h); } }, true);
document.addEventListener("change", (e) => { if (e.target.id === "changes-only") { ui.changesOnly = e.target.checked; render(); } });
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "composer") return;
  e.preventDefault();
  const x = cur(), inp = $("#comment-input"), v = inp.value.trim();
  if (!x || !v) return;
  const id = x.id + "-c-" + Date.now();
  try { await write("comments/" + id, { id, initiativeId: x.id, who: me?.id || null, text: v, ctx: $("#comment-ctx").value, at: new Date().toISOString() }); inp.value = ""; render(); toast("Comment added"); } catch {}
});
$("#new-btn").addEventListener("click", () => mode === "live" ? newInitiative() : toast("Open this page in Claude to make changes"));
window.addEventListener("hashchange", render);

// ---------- boot ----------
render();
(async () => {
  const c = window.claude;
  db = c ? await c.use("db") : null;
  if (!db) { mode = "offline"; await loadExamplesOffline(); render(); return; }
  user = await c.use("user");
  assets = await c.use("assets");
  sampleFn = await c.use("sample");
  try { if (user) { me = await user.me(); if (me && me.id) names[me.id] = { name: me.name || "", color: me.color }; } } catch {}
  canEdit = user ? !!(await user.canEdit().catch(() => false)) : true;
  const w = user ? await user.can("data.write").catch(() => null) : null;
  canWrite = w === null ? true : !!w;
  mode = "live";
  const timer = setTimeout(() => { if (loaded.size < 5) { mode = "live"; toast("Still connecting. Data may be out of date."); render(); } }, 10000);
  for (const col of Object.keys(store)) {
    db.collection(col).onSnapshot((snap) => {
      store[col] = Object.fromEntries(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      if (!snap.metadata.fromCache) loaded.add(col);
      if (loaded.size === 5) clearTimeout(timer);
      schedule();
    }, () => { loaded.add(col); schedule(); });
  }
})();

// Without the shared store (outside Claude), show the examples read-only so the page still explains itself.
async function loadExamplesOffline() {
  const saved = { mode }; mode = "capture";
  const origWrite = write;
  write = async (path, data) => { const [col, id] = path.split("/"); store[col][id] = { id, ...data }; };
  await loadExamples();
  write = origWrite; mode = saved.mode;
}
})();
